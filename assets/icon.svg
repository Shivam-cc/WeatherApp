<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- A sun sinking behind a dark horizon under a dusk sky. Big shapes only, so it stays legible at 16 px. -->
  <defs>
    <clipPath id="tile"><rect width="1024" height="1024" rx="230"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171a46"/>
      <stop offset="0.55" stop-color="#6a3f8e"/>
      <stop offset="1" stop-color="#ff8d4f"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="640" r="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0b3"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#sky)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <circle cx="512" cy="610" r="250" fill="url(#sun)"/>
    <rect y="700" width="1024" height="324" fill="#12132e"/>
  </g>
</svg>
